<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holoul Maintenance</title>
<meta name="theme-color" content="#2D7F67" id="metaTheme">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holoul">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* apply saved language + mode before the page paints (no flash) */
(function(){try{
  var h=document.documentElement, t=localStorage.getItem('holoul_theme')==='night'?'night':'default', l=localStorage.getItem('holoul_lang')==='ar'?'ar':'en';
  h.setAttribute('data-theme',t); h.lang=l; h.dir=l==='ar'?'rtl':'ltr';
  document.getElementById('metaTheme').content = t==='night' ? '#0D1412' : '#2D7F67';
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Themes (Holoul green #2D7F67) ---------- */
  :root{
    --brand:#2D7F67; --brand-2:#1F5F4C; --brand-ink:#ffffff;
    --accent:#2D7F67; --accent-soft:rgba(45,127,103,.10);
    --bg:#F2F4F3; --panel:#FFFFFF; --panel2:#F6F8F7; --line:#DDE4E1; --text:#1D2925; --muted:#6E7A75;
    --wordmark:#7B7C80; --head:#FFFFFF; --strip:#2D7F67;
    --ok:#16A34A; --edit:#D97706; --err:#DC2626;
    --ok-bg:rgba(22,163,74,.08); --ok-line:rgba(22,163,74,.35); --ok-text:#15803D;
    --bad-bg:rgba(220,38,38,.07); --bad-line:rgba(220,38,38,.35); --bad-text:#B91C1C;
    --shadow:0 1px 2px rgba(20,40,32,.06),0 6px 18px rgba(20,40,32,.06);
    --scrim:rgba(10,20,16,.45);
    color-scheme:light;
  }
  [data-theme="night"]{
    --brand:#2D7F67; --brand-2:#1B5443; --brand-ink:#ffffff;
    --accent:#5CBB98; --accent-soft:rgba(92,187,152,.13);
    --bg:#0D1412; --panel:#151F1C; --panel2:#1B2824; --line:#283832; --text:#E3ECE8; --muted:#8C9D96;
    --wordmark:#B7C1BD; --head:#121B18; --strip:#0D1412;
    --ok:#22C55E; --edit:#F59E0B; --err:#EF4444;
    --ok-bg:rgba(34,197,94,.10); --ok-line:rgba(34,197,94,.35); --ok-text:#86EFAC;
    --bad-bg:rgba(239,68,68,.10); --bad-line:rgba(239,68,68,.40); --bad-text:#FCA5A5;
    --shadow:none;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);transition:background .2s,color .2s}
  html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","Open Sans",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
  html[lang="ar"] body *:not(.wm):not(#pin){letter-spacing:0!important}   /* letter-spacing breaks Arabic letter joining */
  /* status-bar strip (iPhone home-screen app) so the clock stays readable in both modes */
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--strip);z-index:40}
  .wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .hidden{display:none!important}
  button{font:inherit;color:inherit}
  svg{flex:none}
  .ltr{direction:ltr;unicode-bidi:isolate}

  /* ---------- Brand lockup (mark + wordmark, like holoulrecycling.com) ---------- */
  .lockup{display:flex;align-items:center;gap:10px;direction:ltr}
  .lockup .mk{height:40px;width:auto;fill:var(--brand)}
  [data-theme="night"] .lockup .mk{fill:var(--accent)}
  .lockup .wm{font-family:"Open Sans",system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:.34em;color:var(--wordmark);line-height:1;display:block}
  .lockup small{display:block;font-size:12px;letter-spacing:.14em;color:var(--accent);margin-top:5px;line-height:1}
  html[lang="ar"] .lockup small{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:13px;letter-spacing:0}

  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
           display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
  .iconbtn svg{width:21px;height:21px;stroke:currentColor}
  .iconbtn:active{transform:scale(.96)}
  .iconbtn.sm{width:36px;height:36px;border-radius:10px;box-shadow:none}

  /* ---------- Sign in ---------- */
  #login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0;position:relative}
  #login .corner{position:absolute;top:14px;inset-inline-end:0}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px}
  .hero .lockup .mk{height:58px}
  .hero .lockup .wm{font-size:28px}
  .hero .lockup small{font-size:13px}
  .hero p{color:var(--muted);font-size:14px;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
  .card.top-accent{border-top:4px solid var(--brand)}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
  .field{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
        color:var(--text);font-size:16px;padding:0 14px;outline:none;margin-bottom:16px;direction:ltr;text-align:start}
  html[lang="ar"] .field{text-align:right}
  .field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
  #pin{letter-spacing:6px}
  .primary{width:100%;height:52px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);
        font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(45,127,103,.28)}
  [data-theme="night"] .primary{box-shadow:none}
  .primary:active{background:var(--brand-2)}
  .primary:disabled{opacity:.6}
  .check{display:flex;align-items:center;gap:10px;margin:-4px 0 18px;font-size:14px;color:var(--text);cursor:pointer;user-select:none;font-weight:400}
  .check input{position:absolute;opacity:0;width:1px;height:1px}
  .check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex:none}
  .check input:checked + .box{background:var(--brand);border-color:var(--brand)}
  .check input:checked + .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .check input:focus-visible + .box{outline:2px solid var(--brand);outline-offset:2px}
  .msg{min-height:20px;font-size:14px;color:var(--err);margin-top:12px;text-align:center}
  .foot-brand{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}

  /* ---------- Home ---------- */
  #home{padding:0 0 32px}
  .appbar{display:flex;align-items:center;justify-content:space-between;margin:0 -16px 18px;padding:12px 16px;
          background:var(--head);border-bottom:3px solid var(--brand)}
  .appbar .lockup .mk{height:36px}
  .appbar .lockup .wm{font-size:18px}
  .welcome{position:relative;overflow:hidden;border-radius:18px;padding:18px 18px 16px;color:#fff;margin-bottom:24px;
           background:linear-gradient(135deg,#2D7F67 0%,#1F5F4C 100%);box-shadow:0 8px 24px rgba(31,95,76,.25)}
  [data-theme="night"] .welcome{background:linear-gradient(135deg,#1F5F4C 0%,#163F34 100%);box-shadow:none}
  .welcome .ghostmk{position:absolute;inset-inline-end:-14px;bottom:-26px;height:150px;width:auto;fill:rgba(255,255,255,.09);pointer-events:none}
  .welcome small{font-size:13px;opacity:.85}
  .welcome h2{font-size:22px;margin-top:2px;font-weight:700}
  .welcome .date{font-size:12px;opacity:.8;margin-top:4px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative}
  .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85)}
  .badge b{color:#fff;font-weight:600}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px;font-weight:700}
  html[lang="ar"] h3{font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:128px;box-shadow:var(--shadow);
        display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:start;color:var(--text);position:relative}
  .tile:active{transform:scale(.98)}
  .tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center}
  .tile .ic svg{width:22px;height:22px;stroke:var(--accent)}
  .tile .go{position:absolute;top:16px;inset-inline-end:14px;width:18px;height:18px;stroke:var(--muted);opacity:.6}
  html[dir="rtl"] .tile .go{transform:scaleX(-1)}
  .tile b{font-size:15px;display:block;margin-top:12px}
  .tile span{font-size:12px;color:var(--muted)}
  .tile.one{grid-column:1/-1}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center;font-size:14px}

  /* ---------- Record page ---------- */
  #rec{padding-bottom:110px}
  .rhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
  .rtop{display:flex;align-items:center;gap:10px}
  .back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
  html[dir="rtl"] .back svg{transform:scaleX(-1)}
  .rtitle{flex:1;min-width:0}
  .rtitle h2{font-size:18px}
  .rtitle small{color:var(--muted);font-size:12px}
  .count{font-size:13px;color:var(--muted);white-space:nowrap;direction:ltr}
  .count b{color:var(--text)}
  .bar{height:5px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  [data-theme="night"] .bar i{background:var(--accent)}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .banner{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-text)}
  .banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-text)}
  .colhead{display:grid;grid-template-columns:1fr 64px 112px;gap:8px;padding:12px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
  .colhead span:nth-child(2){text-align:end}
  .colhead span:nth-child(3){text-align:center}
  .section{font-size:12px;font-weight:700;color:var(--accent);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.6px}
  .row{display:grid;grid-template-columns:1fr 64px 112px;gap:8px;align-items:center;background:var(--panel);box-shadow:var(--shadow);
       border:1px solid var(--line);border-radius:12px;padding:10px;padding-inline-start:12px;margin-bottom:6px}
  .row .id{font-weight:700;font-size:14px}
  .row .ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
  .row .ref{text-align:end;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .inwrap{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .rin{width:84px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);direction:ltr;
       font-size:16px;text-align:center;outline:none;font-variant-numeric:tabular-nums}
  .rin:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--line);background:transparent;cursor:default;display:inline-block}
  .dot.ok{background:var(--ok);border-color:var(--ok)}
  .dot.edit{background:var(--edit);border-color:var(--edit)}
  .dot.saving{background:var(--edit);border-color:var(--edit);animation:pulse .8s infinite alternate}
  .dot.err{background:var(--err);border-color:var(--err);cursor:pointer}
  @keyframes pulse{from{opacity:1}to{opacity:.35}}

  /* Vibration / Thermo: machine card > part > position, inputs side by side */
  .dirkey{font-size:12px;color:var(--muted);padding:12px 4px 2px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  .dirkey span{display:inline-flex;align-items:center;gap:5px}
  .dirkey b{display:inline-block;min-width:20px;text-align:center;padding:1px 5px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;direction:ltr}
  .dirkey .sep{width:1px;height:14px;background:var(--line)}
  .mach{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;box-shadow:var(--shadow)}
  .mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
  .mhead b{font-size:15px;color:var(--accent)}
  .mhead span{font-size:12px;color:var(--muted);direction:ltr}
  .part{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:10px 0 6px;font-weight:700}
  .prow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .part + .prow{border-top:0}
  .pos b{font-size:16px;display:block}
  .pos small{font-size:11px;color:var(--muted)}
  .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
  .cell > span{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .cell .rin{width:100%;max-width:90px}
  .cell .dot{position:absolute;top:14px;inset-inline-end:-3px;width:10px;height:10px;background:var(--panel)}
  .gline{grid-template-columns:92px 1fr}
  .gline .pos b{font-size:14px;line-height:1.2}
  .cell .dot.ok{background:var(--ok)} .cell .dot.edit,.cell .dot.saving{background:var(--edit)} .cell .dot.err{background:var(--err)}

  /* ---------- Daily check page ---------- */
  #chk{padding-bottom:110px}
  .unitrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
  .unitrow select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 10px;font-size:14px;direction:ltr}
  .sect{font-size:12px;font-weight:700;color:var(--accent);padding:16px 4px 6px;text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between}
  .sect span{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  .ci{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;box-shadow:var(--shadow)}
  .ci.fault{border-color:var(--bad-line)}
  .ci .ctop{display:flex;align-items:center;gap:10px}
  .ci .nm{flex:1;min-width:0;font-size:14px;line-height:1.3}
  .ci .nm small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;direction:ltr}
  .seg button{height:40px;min-width:54px;padding:0 10px;border:0;background:var(--panel2);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;display:grid;place-items:center}
  .seg button svg{width:18px;height:18px;stroke:currentColor}
  .seg button + button{border-left:1px solid var(--line)}
  .seg .ok.on{background:var(--ok);color:#fff}
  .seg .bad.on{background:var(--err);color:#fff}
  .fx{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .fx textarea{width:100%;min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:15px;padding:10px;resize:vertical;outline:none}
  .fx textarea:focus{border-color:var(--brand)}
  .rd{display:flex;align-items:center;gap:8px;margin-top:10px}
  .rd input{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;padding:0 12px;outline:none;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
  html[lang="ar"] .rd input{text-align:right}
  .rd input:focus{border-color:var(--brand)}
  .rd .unit{color:var(--muted);font-size:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hint.warn{color:var(--edit)}
  .pbtn{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--text);font-size:14px;cursor:pointer;align-self:flex-start}
  .pbtn svg{width:18px;height:18px;stroke:var(--accent)}
  .pbtn.req{border-color:var(--accent)}
  .thumb{display:flex;align-items:center;gap:10px;margin-top:8px}
  .thumb img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .thumb small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
        background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .foot .inner{max-width:520px;margin:0 auto}
  .foot .note{font-size:13px;color:var(--edit);text-align:center;margin-bottom:8px;min-height:0}
  .primary.green{background:var(--ok);color:#fff}
  .loading{padding:40px 0;text-align:center;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;color:var(--text);
         background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}

  /* ---------- Settings pop-up (bottom sheet) ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;transition:visibility 0s .25s}
  .modal.open{visibility:visible;transition-delay:0s}
  .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
  .modal.open .scrim{opacity:1}
  .sheet{position:relative;width:100%;max-width:520px;background:var(--panel);color:var(--text);border-radius:22px 22px 0 0;
         padding:8px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
         box-shadow:0 -10px 40px rgba(0,0,0,.25);border-top:1px solid var(--line)}
  .modal.open .sheet{transform:none}
  .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
  .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .shead h2{font-size:18px}
  .sgroup{padding:14px 0;border-top:1px solid var(--line)}
  .shead + .sgroup{border-top:0}
  .sgroup > label{margin-bottom:10px;font-size:13px}
  .segctl{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
  .segctl button{height:46px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;
                 display:flex;align-items:center;justify-content:center;gap:8px}
  .segctl button svg{width:18px;height:18px;stroke:currentColor}
  .segctl button.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(45,127,103,.3)}
  .segctl button[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif}
  .segctl button[lang="en"]{font-family:"Open Sans",sans-serif}
  .who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
  .who small{display:block;color:var(--muted);font-size:12px}
  .who b{font-size:15px}

let LANG = document.documentElement.lang === 'ar' ? 'ar' : 'en';
function t(k, p){
  let s = I18N[LANG][k]; if(s == null) s = I18N.en[k]; if(s == null) s = k;
  // in Arabic, isolate each inserted value (names, numbers, times) so mixed text keeps its order
  const wrap = v => LANG === 'ar' ? '\u2068' + v + '\u2069' : String(v);
  return p ? s.replace(/\{(\w+)\}/g, (m, x) => p[x] != null ? wrap(p[x]) : m) : s;
}
/* plural: uses key_one / key_other when the language has them, else the plain key */
function tn(k, n, p){
  const d = I18N[LANG], key = (k + (n === 1 ? '_one' : '_other')) in d ? k + (n === 1 ? '_one' : '_other') : k;
  return t(key, Object.assign({n}, p || {}));
}
const modName = n => { const v = t('mod.' + n); return v === 'mod.' + n ? n : v; };
const modSub  = n => { const v = t('sub.' + n); return v === 'sub.' + n ? '' : v; };
const roleName = r => { const v = t('role.' + r); return v === 'role.' + r ? (r || '') : v; };
const localeTag = () => LANG === 'ar' ? 'ar-u-nu-latn-ca-gregory' : 'en-GB';
function longDate(fallback){
  try{ return new Date().toLocaleDateString(localeTag(), {weekday:'short', day:'numeric', month:'short', year:'numeric', timeZone:'Asia/Riyadh'}); }
  catch(e){ return fallback || ''; }
}
/* messages that come from the server (Code.gs) are English — translate the common ones */
const SERVER_AR = [
  [/^Wrong username or PIN$/, 'اسم المستخدم أو الرمز السري غير صحيح'],
  [/^Enter username and PIN$/, 'أدخل اسم المستخدم والرمز السري'],
  [/^Account is inactive/, 'الحساب غير مفعّل — تواصل مع المشرف'],
  [/^Session expired/, 'انتهت الجلسة — سجّل الدخول مرة أخرى'],
  [/^You do not have access to (.+)$/, m => 'ليس لديك صلاحية على ' + modName(m[1])],
  [/^This page is not set up yet$/, 'هذه الصفحة غير مجهزة بعد'],
  [/^Daily checks are not set up yet$/, 'الفحوصات اليومية غير مجهزة بعد'],
  [/^Please complete: (.+)$/, m => 'أكمل: ' + m[1]],
  [/^Photo is too large$/, 'حجم الصورة كبير جداً'],
  [/^Not an image$/, 'الملف ليس صورة'],
  [/^Invalid row$/, 'بند غير صحيح'],
  [/^Failed to fetch$|^Load failed$|^NetworkError/i, 'لا يوجد اتصال']
];
function trErr(s){
  s = String(s || '');
  if(LANG !== 'ar') return s;
  for(const [re, out] of SERVER_AR){ const m = s.match(re); if(m) return typeof out === 'function' ? out(m) : out; }
  return s;
}
function trStatus(s){
  s = String(s || '');
  if(!s || /^ok$/i.test(s)) return t('statusOK');
  const m = s.match(/action required\s*\((\d+)\)/i);
  return m ? t('statusAction', {n: m[1]}) : s;
}

function applyLang(lang){

  const h = document.documentElement;
  h.lang = LANG; h.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  prefs.set('holoul_lang', LANG);
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));

  if(session && !$('home').classList.contains('hidden')) showHome();

const store = {
  get(){ try{ const s = JSON.parse(localStorage.getItem('holoul_session')); return s && s.token ? s : null; }catch(e){ return null; } },
  set(s){ try{ localStorage.setItem('holoul_session', JSON.stringify(s)); }catch(e){} },
  clear(){ try{ localStorage.removeItem('holoul_session'); localStorage.removeItem('holoul_user'); }catch(e){} }
};
let session = null;

/* "Auto sign in on this device": remembers username + PIN on this phone only */
const remember = {
  get(){ try{ const r = JSON.parse(localStorage.getItem('holoul_remember')); return r && r.u && r.p ? r : null; }catch(e){ return null; } },
  set(u, p){ try{ localStorage.setItem('holoul_remember', JSON.stringify({u, p})); }catch(e){} },
  clear(){ try{ localStorage.removeItem('holoul_remember'); }catch(e){} }
};
// set after "Sign out" so the app doesn't jump straight back in; cleared when the app is closed
const signedOut = {
  get(){ try{ return sessionStorage.getItem('holoul_signed_out') === '1'; }catch(e){ return false; } },
  set(v){ try{ v ? sessionStorage.setItem('holoul_signed_out','1') : sessionStorage.removeItem('holoul_signed_out'); }catch(e){} }
};

async function post(body){
  // text/plain avoids the CORS preflight that Apps Script can't answer
  const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  return res.json();
}

async function api(action, data = {}, retried = false){
  const r = await post({action, token: session && session.token, ...data});
  if(r.auth){
    // session expired: if auto sign in is on, sign in again quietly and repeat the request once
    const saved = remember.get();
    if(saved && !retried){
      const l = await post({action:'login', username: saved.u, pin: saved.p});
      if(l.ok){ session = {token: l.token, user: l.user}; store.set(session); return api(action, data, true); }
      remember.clear();   // PIN changed or user deactivated
    }
    expired(); throw new Error(r.error);
  }
  return r;
}
function expired(){
  store.clear(); session = null; showView('login'); fillRemembered();
  $('msg').textContent = t('sessionExpired');
}

/* ---------- views ---------- */
function showView(v){
  ['login','home','rec','chk'].forEach(id => $(id).classList.toggle('hidden', id !== v));

}

function showHome(){
  const u = session.user;
  showView('home');
  $('uName').textContent = u.name;
  $('uDate').textContent = longDate();
  $('uId').textContent = u.id;
  $('uRole').textContent = roleName(u.role);
  $('eqBadge').classList.toggle('hidden', !u.equipment);
  $('uEq').textContent = u.equipment ? modName(u.equipment) : '';

  const tl = $('tiles'); tl.innerHTML = '';
  if(!u.access || !u.access.length){
    tl.innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(t('noPages'))}</div>`;
    return;
  }
  u.access.forEach(name => {
    const m = MODULES[name] || {icon:''};
    const b = document.createElement('button');
    b.className = 'tile' + (u.access.length === 1 ? ' one' : '');
    b.innerHTML = `<svg class="go" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                   <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></div>
                   <div><b>${esc(modName(name))}</b><span>${esc(modSub(name))}</span></div>`;
    b.onclick = () => m.checklist ? openChecklist(name) : m.ready ? openRecord(name) : toast(t('comingNext', {name: modName(name)}));
    tl.appendChild(b);
  });
}

/* ---------- record page ---------- */
let rec = null;   // { sheet, items: [{row, input, dot, saved, timer, busy}], completed }

async function openRecord(sheet){
  showView('rec');
  $('rTitle').textContent = modName(sheet);
  $('rDate').textContent = '';
  $('rList').innerHTML = `<div class="loading">${esc(t('loading'))}</div>`;
  $('rBanner').classList.add('hidden');
  $('rNote').textContent = '';
  resetComplete();
  rec = { sheet, items: [] };
  try{
    const d = await api('getSheet', {sheet});
    if(!d.ok){ $('rList').innerHTML = `<div class="empty">${esc(trErr(d.error))}</div>`; return; }
    $('rDate').textContent = longDate(d.date);
    $('rRefHead').textContent = shortRef(d.refHeader);
    $('rColHead').classList.toggle('hidden', d.layout !== 'list');
    d.layout === 'vibration' ? renderVibration(d.rows) : d.layout === 'grouped' ? renderGrouped(d.rows) : renderRows(d.rows);
    setCompleted(d.completed);
    updateCount();
  }catch(e){
    if(session) $('rList').innerHTML = `<div class="empty">${esc(t('noConnBack'))}</div>`;
  }
}
function shortRef(h){ h = String(h||'').trim(); return (LANG === 'ar' || h.length > 8 || !h) ? t('colRef') : h; }

function renderRows(rows){
  const list = $('rList'); list.innerHTML = '';
  rows.forEach(r => {
    if(r.section){
      const s = document.createElement('div'); s.className = 'section'; s.textContent = r.section; list.appendChild(s); return;
    }
    const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `<div><div class="id">${esc(r.id)}</div><div class="ds">${esc(r.desc)}</div></div>
      <div class="ref">${esc(r.ref)}</div>
      <div class="inwrap"><input class="rin" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(t('colReading') + ' ' + r.id)}"><i class="dot"></i></div>`;
    list.appendChild(el);
    makeItem(r, el.querySelector('.rin'), el.querySelector('.dot'));
  });
  if(!rec.items.length) list.innerHTML = `<div class="empty">${esc(t('noRows'))}</div>`;
}

/* Vibration: group rows by machine > Motor/Bearing > position, with H / V / A side by side */
function renderVibration(rows){
  const list = $('rList'); list.innerHTML = '';
  const chip = k => `<span><b>${esc(k)}</b>${esc(t((/[HVA]/.test(k) ? 'dir.' : 'pos.') + k))}</span>`;
  list.insertAdjacentHTML('beforeend', `<div class="dirkey">${['H','V','A'].map(chip).join('')}<i class="sep"></i>${['F','B','L','R'].map(chip).join('')}</div>`);
  const DIRS = ['H','V','A'];
  let mEl = null, mName = null, part = null, prowKey = null, cells = null;
  rows.forEach(r => {
    if(r.machine !== mName){
      mName = r.machine; part = null; prowKey = null;
      mEl = document.createElement('div'); mEl.className = 'mach';
      mEl.innerHTML = `<div class="mhead"><b>${esc(r.machine)}</b><span class="mcount"></span></div>`;
      list.appendChild(mEl);
    }
    if(r.part !== part){
      part = r.part; prowKey = null;
      mEl.insertAdjacentHTML('beforeend', `<div class="part">${esc(r.part)}</div>`);
    }
    if(r.part + r.pos !== prowKey){
      prowKey = r.part + r.pos;
      const p = document.createElement('div'); p.className = 'prow';
      const posName = I18N[LANG]['pos.' + r.pos] || r.posName;
      p.innerHTML = `<div class="pos"><b>${esc(r.pos)}</b><small>${esc(posName)}</small></div><div class="cells"></div>`;
      mEl.appendChild(p);
      cells = p.querySelector('.cells');
      // fixed H / V / A slots so columns line up; unused slots stay empty
      DIRS.forEach(dir => { const s = document.createElement('div'); s.className = 'cell'; s.dataset.dir = dir; cells.appendChild(s); });
    }
    const slot = cells.querySelector(`[data-dir="${r.dir}"]`) || cells.appendChild(Object.assign(document.createElement('div'), {className:'cell'}));
    slot.innerHTML = `<span>${esc(r.dir)}</span><input class="rin" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(r.machine + ' ' + r.part + ' ' + r.posName + ' ' + r.dirName)}"><i class="dot"></i>`;
    const item = makeItem(r, slot.querySelector('.rin'), slot.querySelector('.dot'));
    item.machineEl = mEl;
  });
  if(!rec.items.length) list.innerHTML = `<div class="empty">${esc(t('noRows'))}</div>`;
}

/* Grouped (Thermo Rec): card per area, one line per equipment, its points (Motor, Gearbox…) side by side */
function renderGrouped(rows){
  const list = $('rList'); list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', `<div class="dirkey">${esc(t('thermoKey'))}</div>`);
  let card = null, group = null, line = null, item = null;
  rows.forEach(r => {
    if(r.group !== group){
      group = r.group; item = null;
      card = document.createElement('div'); card.className = 'mach';
      card.innerHTML = `<div class="mhead"><b>${esc(r.group)}</b><span class="mcount"></span></div>`;
      list.appendChild(card);
    }
    if(r.item !== item){
      item = r.item;
      line = document.createElement('div'); line.className = 'prow gline';
      line.innerHTML = `<div class="pos"><b>${esc(r.item)}</b></div><div class="cells"></div>`;
      card.appendChild(line);
    }
    const cells = line.querySelector('.cells');
    const slot = document.createElement('div'); slot.className = 'cell';
    slot.innerHTML = `<span>${esc(r.point)}</span><input class="rin" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(r.item + ' ' + r.point)}"><i class="dot"></i>`;
    cells.appendChild(slot);
    cells.style.gridTemplateColumns = `repeat(${Math.max(2, cells.children.length)},1fr)`;
    makeItem(r, slot.querySelector('.rin'), slot.querySelector('.dot')).machineEl = card;
  });
  if(!rec.items.length) list.innerHTML = `<div class="empty">${esc(t('noRows'))}</div>`;
}

/* Shared behaviour for every reading box: auto-save, dots, Enter = next */
function makeItem(r, input, dot){
  const item = { row: r.row, input, dot, saved: r.value || '', timer: null, busy: false };
  input.value = item.saved;
  setDot(item, item.saved ? 'ok' : '');
  input.addEventListener('input', () => {
    clearTimeout(item.timer);
    if(input.value.trim() !== item.saved){ setDot(item, 'edit'); item.timer = setTimeout(() => save(item), 1500); }
    else setDot(item, item.saved ? 'ok' : '');
  });
  input.addEventListener('blur', () => { clearTimeout(item.timer); save(item); });
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); const i = rec.items.indexOf(item); const nx = rec.items[i+1]; nx ? nx.input.focus() : input.blur(); }
  });
  dot.addEventListener('click', () => { if(dot.classList.contains('err')) save(item); });
  rec.items.push(item);
  return item;
}

function setDot(item, state){ item.dot.className = 'dot' + (state ? ' ' + state : ''); }

async function save(item){
  const v = item.input.value.trim();
  if(v === item.saved){ if(!item.busy) setDot(item, v ? 'ok' : ''); return; }
  if(item.busy){ item.again = true; return; }       // save again once the current save finishes
  item.busy = true; setDot(item, 'saving');
  try{
    const r = await api('saveReading', {sheet: rec.sheet, row: item.row, value: v});
    if(!r.ok) throw new Error(r.error);
    item.saved = v;
    if(r.column) $('rDate').dataset.col = r.column;
  }catch(e){
    item.busy = false; setDot(item, 'err');
    if(session) toast(t('notSavedToast', {e: trErr(e.message) || t('noConnection')}));
    return;
  }
  item.busy = false;
  if(item.again || item.input.value.trim() !== item.saved){ item.again = false; return save(item); }
  setDot(item, item.saved ? 'ok' : '');
  updateCount();
}

function updateCount(){
  const total = rec.items.length, done = rec.items.filter(i => i.saved !== '').length;
  $('rDone').textContent = done; $('rTotal').textContent = total;
  $('rBar').style.width = total ? (done / total * 100) + '%' : 0;
  // per-machine counter on the vibration / thermo pages
  const per = new Map();
  rec.items.forEach(i => { if(!i.machineEl) return; const c = per.get(i.machineEl) || [0,0]; c[1]++; if(i.saved !== '') c[0]++; per.set(i.machineEl, c); });
  per.forEach((c, el) => { const s = el.querySelector('.mcount'); s.textContent = `${c[0]} / ${c[1]}`; s.style.color = c[0] === c[1] ? 'var(--ok)' : ''; });
}

function setCompleted(c){
  const b = $('rBanner');
  if(c){ b.textContent = t('completedBy', {by: c.by, at: c.at, ft: c.filled + '/' + c.total}); b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}

let confirmMissing = false;
function resetComplete(){ confirmMissing = false; const b = $('rComplete'); b.textContent = t('completeTask'); b.className = 'primary'; b.disabled = false; }

$('rComplete').onclick = async () => {
  const b = $('rComplete');
  // finish any pending edits first
  rec.items.forEach(i => { clearTimeout(i.timer); if(i.input.value.trim() !== i.saved) save(i); });
  if(rec.items.some(i => i.busy || i.dot.classList.contains('edit'))){ $('rNote').textContent = t('savingLast'); return; }
  if(rec.items.some(i => i.dot.classList.contains('err'))){ $('rNote').textContent = t('someNotSaved'); return; }
  const missing = rec.items.filter(i => i.saved === '').length;
  if(missing && !confirmMissing){
    confirmMissing = true;
    $('rNote').textContent = tn('emptyReadings', missing);
    b.textContent = t('completeAnyway');
    const first = rec.items.find(i => i.saved === '');
    first && first.input.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  b.disabled = true; b.textContent = t('submitting'); $('rNote').textContent = '';
  try{
    const r = await api('complete', {sheet: rec.sheet});
    if(!r.ok) throw new Error(r.error);
    setCompleted(r.completed);
    b.className = 'primary green'; b.textContent = t('taskCompleted', {ft: r.filled + '/' + r.total});
    toast(t('taskRecorded'));
    setTimeout(() => { resetComplete(); showHome(); }, 1800);
  }catch(e){
    b.disabled = false; b.textContent = t('completeTask');
    if(session) $('rNote').textContent = t('couldNotSubmit', {e: trErr(e.message) || t('noConnection')});
  }
};

$('back').onclick = () => {
  const pending = rec && rec.items.some(i => i.busy || i.input.value.trim() !== i.saved);
  if(pending){ rec.items.forEach(i => { clearTimeout(i.timer); save(i); }); toast(t('savingTryBack')); return; }
  showHome();
};

/* ---------- daily check (Bobcat / Forklift) ---------- */
let chk = null;   // { type, unit, d (server data), ans: {item: {v, note, value, photo, thumb, up}} }
let photoFor = null;
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>';
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const shortDate = s => { if(!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString(LANG === 'ar' ? 'ar-u-nu-latn' : 'en-GB', {day:'numeric', month:'short'}); };
const draftKey = () => `holoul_chk_${chk.type}_${chk.unit}_${chk.d.today}`;
function saveDraft(){
  try{
    const out = {}; Object.entries(chk.ans).forEach(([k, a]) => { out[k] = {v:a.v, note:a.note, value:a.value, photo:a.photo, thumb:a.thumb}; });
    localStorage.setItem(draftKey(), JSON.stringify(out));
  }catch(e){}
}

async function openChecklist(type, unit){
  showView('chk');
  $('cTitle').textContent = t('dailyCheckTitle', {type: modName(type)});
  $('cDate').textContent = ''; $('cNote').textContent = '';
  $('cList').innerHTML = `<div class="loading">${esc(t('loading'))}</div>`;
  $('cBanner').classList.add('hidden');
  $('cSubmit').className = 'primary'; $('cSubmit').disabled = false; $('cSubmit').textContent = t('submitCheck');
  try{
    const d = await api('getChecklist', {type, unit});
    if(!d.ok){ $('cList').innerHTML = `<div class="empty">${esc(trErr(d.error))}</div>`; return; }
    chk = { type, unit: d.unit, d, ans: {} };
    $('cDate').textContent = longDate(d.date);
    $('cUnit').innerHTML = d.units.map(u => `<option ${u === d.unit ? 'selected' : ''}>${esc(u)}</option>`).join('');
    $('cUnit').disabled = d.units.length < 2;
    // start from today's saved entry (if any), then any unsent draft on this phone
    d.items.forEach(it => chk.ans[it.item] = {});
    if(d.todayEntry){
      const e = d.todayEntry;
      const notes = {}; String(e.faults || '').split('\n').forEach(l => { const i = l.indexOf(': '); if(i > 0) notes[l.slice(0, i)] = l.slice(i + 2).replace(/ \(photo: [^)]*\)$/, ''); });
      d.items.forEach(it => {
        const v = e.values[it.item] || '', a = chk.ans[it.item];
        if(it.input === 'reading'){ a.value = v; a.photo = e.values[it.item + ' Photo'] || ''; }
        else { a.v = v === '✓' ? 'ok' : v === '✗' ? 'fault' : ''; a.note = notes[it.item] || ''; }
      });
      showSubmitted(e.at, e.by, e.status, true);
    }
    try{ const dr = JSON.parse(localStorage.getItem(draftKey())); if(dr) Object.entries(dr).forEach(([k, a]) => { if(chk.ans[k]) Object.assign(chk.ans[k], a); }); }catch(e){}
    renderChecklist();
  }catch(e){
    if(session) $('cList').innerHTML = `<div class="empty">${esc(t('noConnBack'))}</div>`;
  }
}

function showSubmitted(at, by, status, existing){
  const b = $('cBanner');
  const bad = /action/i.test(status || '');
  b.textContent = t('submittedAt', {at, by, status: trStatus(status)}) + (existing ? t('canChange') : '');
  b.classList.toggle('bad', bad);
  b.classList.remove('hidden');
  if(existing) $('cSubmit').textContent = t('updateCheck');
}

function renderChecklist(){
  const list = $('cList'); list.innerHTML = '';
  let sec = null;
  chk.d.items.forEach(it => {
    const a = chk.ans[it.item];
    if(it.section !== sec){
      sec = it.section;
      list.insertAdjacentHTML('beforeend', `<div class="sect">${esc(sec || t('checks'))}${it.weekly ? `<span>${esc(t('onceWeek'))}</span>` : ''}</div>`);
    }
    const el = document.createElement('div');
    el.className = 'ci' + (a.v === 'fault' ? ' fault' : '');
    if(it.input === 'reading'){
      const last = chk.d.last[it.item];
      const unitTxt = /hour/i.test(it.item) ? t('hours') : '';
      el.innerHTML = `<div class="nm">${esc(it.item)}${last ? `<small>${esc(t('last'))}: ${esc(last.value)}${unitTxt ? ' ' + esc(unitTxt) : ''} · ${esc(shortDate(last.date))} · ${esc(last.by)}</small>` : ''}</div>
        <div class="rd"><input inputmode="decimal" autocomplete="off" placeholder="${esc(t('enterReading'))}" value="${esc(a.value || '')}" aria-label="${esc(it.item)}">${unitTxt ? `<span class="unit">${esc(unitTxt)}</span>` : ''}</div>
        <div class="hint" data-warn></div>
        <div class="fx">${photoBlock(it, a)}</div>`;
      const inp = el.querySelector('input');
      inp.addEventListener('input', () => { a.value = inp.value.trim(); checkReading(it, a, el.querySelector('[data-warn]')); saveDraft(); updateChkCount(); });
      checkReading(it, a, el.querySelector('[data-warn]'));
    } else {
      const sub = it.weekly ? `<small>${chk.d.weeklyLast[it.item] ? esc(t('lastDone', {d: shortDate(chk.d.weeklyLast[it.item])})) : esc(t('notDoneYet'))} · ${esc(t('leaveBlank'))}</small>` : '';
      el.innerHTML = `<div class="ctop"><div class="nm">${esc(it.item)}${sub}</div>
          <div class="seg"><button class="ok ${a.v === 'ok' ? 'on' : ''}" aria-label="${esc(t('noFault'))}">${TICK}</button><button class="bad ${a.v === 'fault' ? 'on' : ''}" aria-label="${esc(t('actionRequired'))}">${CROSS}</button></div></div>
        ${a.v === 'fault' ? `<div class="fx"><textarea placeholder="${esc(t('whatWrong'))}">${esc(a.note || '')}</textarea>${photoBlock(it, a)}</div>` : ''}`;
      const [ok, bad] = el.querySelectorAll('.seg button');
      ok.onclick = () => { a.v = a.v === 'ok' && it.weekly ? '' : 'ok'; saveDraft(); renderChecklist(); };
      bad.onclick = () => { a.v = 'fault'; saveDraft(); renderChecklist(); setTimeout(() => { const ta = document.querySelector(`[data-item="${CSS.escape(it.item)}"] textarea`); ta && ta.focus(); }, 0); };
      const ta = el.querySelector('textarea');
      if(ta) ta.addEventListener('input', () => { a.note = ta.value; saveDraft(); });
    }
    el.dataset.item = it.item;
    const pb = el.querySelector('.pbtn');
    if(pb) pb.onclick = () => { photoFor = it.item; $('photoPick').value = ''; $('photoPick').click(); };
    const retry = el.querySelector('[data-retry]');
    if(retry) retry.onclick = () => uploadFor(it.item);
    list.appendChild(el);
  });
  updateChkCount();
}

function photoBlock(it, a){
  if(it.photo === 'no') return '';
  const label = a.thumb || a.photo ? t('photoRetake') : (it.photo === 'required' ? t('photoRequired') : t('photoOptional'));
  let status = '';
  if(a.up === 'saving') status = `<i class="dot saving"></i> ${esc(t('uploading'))}`;
  else if(a.up === 'err') status = `<i class="dot err" data-retry></i> ${esc(t('notUploaded'))}`;
  else if(a.photo) status = `<i class="dot ok"></i> ${esc(t('savedDrive'))}`;
  const img = a.thumb ? `<img src="${a.thumb}" alt="">` : '';
  return `<button type="button" class="pbtn ${it.photo === 'required' && !a.photo ? 'req' : ''}">${CAM}<span>${esc(label)}</span></button>
          ${img || status ? `<div class="thumb">${img}<small>${status}</small></div>` : ''}`;
}

function checkReading(it, a, el){
  el.textContent = ''; el.className = 'hint';
  const last = chk.d.last[it.item], n = parseFloat(String(a.value || '').replace(',', '.'));
  if(!last || isNaN(n)) return;
  const prev = parseFloat(String(last.value).replace(',', '.'));
  if(isNaN(prev)) return;
  const days = Math.max(1, Math.round((new Date(chk.d.today) - new Date(last.date)) / 864e5));
  if(n < prev){ el.textContent = t('lowerThanLast', {v: last.value}); el.className = 'hint warn'; }
  else if(/hour/i.test(it.item) && n - prev > 24 * days){ el.textContent = tn('over24', days, {x: '+' + (n - prev).toFixed(1), d: days}); el.className = 'hint warn'; }
  else el.textContent = t('sinceLast', {x: '+' + (n - prev).toFixed(1)});
}

function updateChkCount(){
  if(!chk) return;
  const need = chk.d.items.filter(it => it.input === 'reading' || !it.weekly);
  const done = need.filter(it => { const a = chk.ans[it.item]; return it.input === 'reading' ? !!a.value : !!a.v; }).length;
  $('cDone').textContent = done; $('cTotal').textContent = need.length;
  $('cBar').style.width = need.length ? (done / need.length * 100) + '%' : 0;
}

/* photos: shrink on the phone (max 1600 px) before uploading, keep a small thumbnail for the screen */
function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = rej; img.src = url; });
}
function scaled(img, max, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
$('photoPick').addEventListener('change', async () => {
  const f = $('photoPick').files[0]; if(!f || !photoFor || !chk) return;
  const a = chk.ans[photoFor];
  try{
    const img = await loadImage(f);
    a.full = scaled(img, 1600, 0.82); a.thumb = scaled(img, 240, 0.7); a.photo = '';
  }catch(e){ toast(t('cantReadPhoto')); return; }
  uploadFor(photoFor);
});
async function uploadFor(item){
  const a = chk.ans[item]; if(!a.full) return;
  a.up = 'saving'; renderChecklist();
  try{
    const r = await api('uploadPhoto', {type: chk.type, unit: chk.unit, kind: item, data: a.full});
    if(!r.ok) throw new Error(r.error);
    a.photo = r.url; a.up = ''; delete a.full;
  }catch(e){ a.up = 'err'; if(session) toast(t('photoNotUploaded', {e: trErr(e.message) || t('noConnection')})); }
  saveDraft(); renderChecklist();
}

$('cUnit').onchange = () => openChecklist(chk.type, $('cUnit').value);
$('cBack').onclick = () => {
  if(chk && Object.values(chk.ans).some(a => a.up === 'saving')){ toast(t('photoUploading')); return; }
  showHome();
};

$('cSubmit').onclick = async () => {
  const b = $('cSubmit'), note = $('cNote');
  const ans = chk.ans, missing = [];
  let firstEl = null;
  chk.d.items.forEach(it => {
    const a = ans[it.item]; let bad = false;
    if(it.input === 'reading'){ if(!a.value){ missing.push(it.item); bad = true; } if(it.photo === 'required' && !a.photo){ missing.push(t('meterPhoto')); bad = true; } }
    else if(!it.weekly && !a.v){ missing.push(it.item); bad = true; }
    if(a.v === 'fault' && !String(a.note || '').trim()){ missing.push(t('describeFault', {x: it.item})); bad = true; }
    if(bad && !firstEl) firstEl = document.querySelector(`[data-item="${CSS.escape(it.item)}"]`);
  });
  if(Object.values(ans).some(a => a.up === 'saving')){ note.textContent = t('waitPhoto'); return; }
  if(missing.length){
    note.textContent = missing.length === 1 ? t('stillNeeded', {x: missing[0]}) : t('itemsNeeded', {n: missing.length, x: missing[0]});
    firstEl && firstEl.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  note.textContent = ''; b.disabled = true; b.textContent = t('submitting');
  const data = {answers: {}};
  Object.entries(ans).forEach(([k, a]) => data.answers[k] = {v: a.v || '', note: a.note || '', value: a.value || '', photo: a.photo || ''});
  try{
    const r = await api('submitCheck', {type: chk.type, unit: chk.unit, data});
    if(!r.ok) throw new Error(r.error);
    try{ localStorage.removeItem(draftKey()); }catch(e){}
    showSubmitted(r.at, r.by, r.status, false);
    b.className = 'primary green'; b.textContent = r.faults ? tn('submittedFaults', r.faults) : t('submittedOK');
    toast(t('checkSaved'));
    setTimeout(() => showHome(), 2200);
  }catch(e){
    b.disabled = false; b.textContent = t('submitCheck');
    if(session) note.textContent = t('couldNotSubmit', {e: trErr(e.message) || t('noConnection')});
  }
};

/* ---------- sign in / out ---------- */
let tt;
function toast(s){ const e=$('toast'); e.textContent=s; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),2600); }

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('btn'); $('msg').textContent = '';
  btn.disabled = true; btn.textContent = t('signingIn');
  const u = $('username').value.trim(), p = $('pin').value.trim();
  try{
    const r = await post({action:'login', username: u, pin: p});
    if(r.ok){
      session = {token: r.token, user: r.user}; store.set(session); signedOut.set(false);
      $('auto').checked ? remember.set(u, p) : remember.clear();
      if(!$('auto').checked) $('pin').value = '';
      showHome();
    } else {
      $('msg').textContent = trErr(r.error) || t('signInFailed');
      if(remember.get()){ remember.clear(); $('auto').checked = false; }   // saved PIN no longer valid
    }
  }catch(e){
    $('msg').textContent = t('noConnLogin');
  }finally{
    btn.disabled = false; btn.textContent = t('signIn');
  }
});

// unticking forgets the saved sign-in straight away
$('auto').addEventListener('change', () => { if(!$('auto').checked){ remember.clear(); $('pin').value = ''; } });

$('logout').onclick = () => {
  closeSettings();
  store.clear(); session = null; signedOut.set(true);
  fillRemembered();            // keep the saved user filled in, but don't sign in again by itself
  $('msg').textContent = '';
  showView('login');
};

function fillRemembered(){
  const saved = remember.get();
  $('auto').checked = !!saved;
  if(saved){ $('username').value = saved.u; $('pin').value = saved.p; }
}

/* ---------- start ---------- */
applyTheme(prefs.get('holoul_theme'));
applyLang(LANG);
session = store.get();
if(session) showHome();
else {
  showView('login');
  fillRemembered();
  if(remember.get() && !signedOut.get()) $('form').requestSubmit();   // auto sign in
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
