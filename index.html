<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holoul Maintenance</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0f141b; --panel:#171e28; --panel2:#1f2835; --line:#2a3544;
    --text:#e8edf3; --muted:#8a97a8; --amber:#f5a524; --amber-ink:#1a1204;
    --ok:#22c55e; --edit:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .hidden{display:none!important}
  button{font:inherit}

  /* Sign in */
  #login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .logo{width:48px;height:48px;border-radius:12px;background:#111827;border:1px solid var(--line);display:grid;place-items:center}
  .brand h1{font-size:22px;letter-spacing:.2px}
  .brand p{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .field{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
        color:var(--text);font-size:16px;padding:0 14px;outline:none;margin-bottom:16px}
  .field:focus{border-color:var(--amber)}
  #pin{letter-spacing:6px}
  .primary{width:100%;height:50px;border:0;border-radius:10px;background:var(--amber);color:var(--amber-ink);
        font-weight:700;font-size:16px;cursor:pointer}
  .primary:disabled{opacity:.6}
  .check{display:flex;align-items:center;gap:10px;margin:-4px 0 18px;font-size:14px;color:var(--text);cursor:pointer;user-select:none}
  .check input{position:absolute;opacity:0;width:1px;height:1px}
  .check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex:none}
  .check input:checked + .box{background:var(--amber);border-color:var(--amber)}
  .check input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--amber-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .check input:focus-visible + .box{outline:2px solid var(--amber);outline-offset:2px}
  .msg{min-height:20px;font-size:14px;color:var(--err);margin-top:12px;text-align:center}

  /* Home */
  #home{padding:20px 0 32px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .hello small{color:var(--muted);font-size:13px}
  .hello h2{font-size:20px;margin-top:2px}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;height:38px;padding:0 14px;font-size:14px;cursor:pointer}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge b{color:var(--text);font-weight:600}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:118px;
        display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;color:var(--text)}
  .tile:active{transform:scale(.98)}
  .tile .ic{width:38px;height:38px;border-radius:10px;background:rgba(245,165,36,.12);display:grid;place-items:center}
  .tile .ic svg{width:22px;height:22px;stroke:var(--amber)}
  .tile b{font-size:15px;display:block;margin-top:12px}
  .tile span{font-size:12px;color:var(--muted)}
  .tile.one{grid-column:1/-1}
  .tile .done{font-size:11px;color:var(--ok);margin-top:4px;display:block}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center;font-size:14px}

  /* Record page */
  #rec{padding-bottom:110px}
  .rhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
  .rtop{display:flex;align-items:center;gap:10px}
  .back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
  .rtitle{flex:1;min-width:0}
  .rtitle h2{font-size:18px}
  .rtitle small{color:var(--muted);font-size:12px}
  .count{font-size:13px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--text)}
  .bar{height:4px;background:var(--panel2);border-radius:4px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}
  .legend span{display:flex;align-items:center;gap:5px}
  .banner{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#86efac}
  .colhead{display:grid;grid-template-columns:1fr 64px 112px;gap:8px;padding:12px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .colhead span:nth-child(2){text-align:right}
  .colhead span:nth-child(3){text-align:center}
  .section{font-size:12px;font-weight:700;color:var(--amber);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.6px}
  .row{display:grid;grid-template-columns:1fr 64px 112px;gap:8px;align-items:center;background:var(--panel);
       border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:6px}
  .row .id{font-weight:700;font-size:14px}
  .row .ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
  .row .ref{text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .inwrap{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .rin{width:84px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
       font-size:16px;text-align:center;outline:none;font-variant-numeric:tabular-nums}
  .rin:focus{border-color:var(--amber)}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--line);background:transparent;cursor:default}
  .dot.ok{background:var(--ok);border-color:var(--ok)}
  .dot.edit{background:var(--edit);border-color:var(--edit)}
  .dot.saving{background:var(--edit);border-color:var(--edit);animation:pulse .8s infinite alternate}
  .dot.err{background:var(--err);border-color:var(--err);cursor:pointer}
  @keyframes pulse{from{opacity:1}to{opacity:.35}}

  /* Vibration layout: machine > part > position, with H / V / A inputs side by side */
  .dirkey{font-size:11px;color:var(--muted);padding:12px 4px 2px}
  .mach{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
  .mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .mhead b{font-size:15px;color:var(--amber)}
  .mhead span{font-size:12px;color:var(--muted)}
  .part{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:10px 0 6px}
  .prow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .part + .prow{border-top:0}
  .pos b{font-size:16px;display:block}
  .pos small{font-size:11px;color:var(--muted)}
  .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
  .cell > span{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .cell .rin{width:100%;max-width:90px}
  .cell .dot{position:absolute;top:14px;right:-3px;width:10px;height:10px;background:var(--bg)}
  /* Daily check page */
  #chk{padding-bottom:110px}
  .unitrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
  .unitrow select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;font-size:14px}
  .sect{font-size:12px;font-weight:700;color:var(--amber);padding:16px 4px 6px;text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between}
  .sect span{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  .ci{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
  .ci.fault{border-color:rgba(239,68,68,.55)}
  .ci .top{display:flex;align-items:center;gap:10px;margin-bottom:0}
  .ci .nm{flex:1;min-width:0;font-size:14px;line-height:1.3}
  .ci .nm small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .seg button{height:40px;min-width:54px;padding:0 10px;border:0;background:var(--panel2);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
  .seg button + button{border-left:1px solid var(--line)}
  .seg .ok.on{background:var(--ok);color:#052e16}
  .seg .bad.on{background:var(--err);color:#fff}
  .fx{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .fx textarea{width:100%;min-height:62px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:15px;padding:10px;resize:vertical;outline:none}
  .fx textarea:focus{border-color:var(--amber)}
  .rd{display:flex;align-items:center;gap:8px;margin-top:10px}
  .rd input{flex:1;min-width:0;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;padding:0 12px;outline:none;font-variant-numeric:tabular-nums}
  .rd input:focus{border-color:var(--amber)}
  .rd .unit{color:var(--muted);font-size:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hint.warn{color:var(--edit)}
  .pbtn{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:9px;border:1px dashed var(--line);background:none;color:var(--text);font-size:14px;cursor:pointer;align-self:flex-start}
  .pbtn svg{width:18px;height:18px;stroke:var(--amber)}
  .pbtn.req{border-color:var(--amber)}
  .thumb{display:flex;align-items:center;gap:10px;margin-top:8px}
  .thumb img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .thumb small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .gline{grid-template-columns:92px 1fr}
  .gline .pos b{font-size:14px;line-height:1.2}
  .cell .dot.ok{background:var(--ok)} .cell .dot.edit,.cell .dot.saving{background:var(--edit)} .cell .dot.err{background:var(--err)}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
        background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .foot .inner{max-width:520px;margin:0 auto}
  .foot .note{font-size:13px;color:var(--edit);text-align:center;margin-bottom:8px;min-height:0}
  .primary.green{background:var(--ok);color:#052e16}
  .loading{padding:40px 0;text-align:center;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;
         background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- SIGN IN -->
  <section id="login">
    <div class="brand">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
      </div>
      <div><h1>Holoul Maintenance</h1><p>Sign in to continue</p></div>
    </div>
    <form class="card" id="form" autocomplete="on">
      <label for="username">Username</label>
      <input class="field" id="username" autocapitalize="none" autocomplete="username" spellcheck="false" required>
      <label for="pin">PIN</label>
      <input class="field" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required>
      <label class="check" for="auto">
        <input type="checkbox" id="auto">
        <span class="box" aria-hidden="true"></span>
        <span>Auto sign in on this device</span>
      </label>
      <button class="primary" id="btn" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden">
    <div class="top">
      <div class="hello"><small>Welcome</small><h2 id="uName"></h2></div>
      <button class="ghost" id="logout">Sign out</button>
    </div>
    <div class="badges">
      <div class="badge">ID <b id="uId"></b></div>
      <div class="badge">Role <b id="uRole"></b></div>
      <div class="badge hidden" id="eqBadge">Equipment <b id="uEq"></b></div>
    </div>
    <h3>Your access</h3>
    <div class="grid" id="tiles"></div>
  </section>

  <!-- RECORD PAGE -->
  <section id="rec" class="hidden">
    <div class="rhead">
      <div class="rtop">
        <button class="back" id="back" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="rtitle"><h2 id="rTitle"></h2><small id="rDate"></small></div>
        <div class="count"><b id="rDone">0</b> / <span id="rTotal">0</span></div>
      </div>
      <div class="bar"><i id="rBar"></i></div>
      <div class="legend">
        <span><i class="dot ok"></i>Saved</span>
        <span><i class="dot edit"></i>Editing / saving</span>
        <span><i class="dot err"></i>Not saved – tap to retry</span>
      </div>
      <div class="banner hidden" id="rBanner"></div>
    </div>
    <div class="colhead" id="rColHead"><span>Cable ID / Description</span><span id="rRefHead">Ref</span><span>Reading</span></div>
    <div id="rList"><div class="loading">Loading…</div></div>
    <div class="foot">
      <div class="inner">
        <div class="note" id="rNote"></div>
        <button class="primary" id="rComplete">Complete task</button>
      </div>
    </div>
  </section>

  <!-- DAILY CHECK (Bobcat / Forklift) -->
  <section id="chk" class="hidden">
    <div class="rhead">
      <div class="rtop">
        <button class="back" id="cBack" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="rtitle"><h2 id="cTitle"></h2><small id="cDate"></small></div>
        <div class="count"><b id="cDone">0</b> / <span id="cTotal">0</span></div>
      </div>
      <div class="bar"><i id="cBar"></i></div>
      <div class="unitrow"><span>Unit</span><select id="cUnit"></select></div>
      <div class="banner hidden" id="cBanner"></div>
    </div>
    <div id="cList"><div class="loading">Loading…</div></div>
    <div class="foot">
      <div class="inner">
        <div class="note" id="cNote"></div>
        <button class="primary" id="cSubmit">Submit daily check</button>
      </div>
    </div>
  </section>

</div>
<input type="file" id="photoPick" accept="image/*" class="hidden">
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby6cn2Os6fkkireTwP8QJqV-8E45gf5V6wovl_8fz28RL_vEG3Rg0nuuEKFv3kwdYWMCw/exec';

/* Pages. `ready: true` = the record page is built. */
const MODULES = {
  'Amp Rec':       { sub:'Motor current readings',   ready:true,  icon:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>' },
  'Vibration Rec': { sub:'Bearing & motor vibration', ready:true, icon:'<path d="M2 12h3l2-6 4 12 4-12 2 6h5"/>' },
  'Thermo Rec':    { sub:'Motor & gearbox temps',    ready:true,  icon:'<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>' },
  'Forklift':      { sub:'Daily forklift check',                   icon:'<path d="M3 18V8h6l3 6v4M12 18h3M16 4v14h5M3 18h1"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/>' },
  'Bobcat':        { sub:'Daily bobcat check', checklist:true,     icon:'<path d="M3 16V9h7l2 3h5v4M17 12l4-4"/><circle cx="7" cy="17" r="2"/><circle cx="15" cy="17" r="2"/>' }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- session ---------- */
const store = {
  get(){ try{ const s = JSON.parse(localStorage.getItem('holoul_session')); return s && s.token ? s : null; }catch(e){ return null; } },
  set(s){ try{ localStorage.setItem('holoul_session', JSON.stringify(s)); }catch(e){} },
  clear(){ try{ localStorage.removeItem('holoul_session'); localStorage.removeItem('holoul_user'); }catch(e){} }
};
let session = null;

/* "Auto sign in on this device": remembers username + PIN on this phone only */
const remember = {
  get(){ try{ const r = JSON.parse(localStorage.getItem('holoul_remember')); return r && r.u && r.p ? r : null; }catch(e){ return null; } },
  set(u, p){ try{ localStorage.setItem('holoul_remember', JSON.stringify({u, p})); }catch(e){} },
  clear(){ try{ localStorage.removeItem('holoul_remember'); }catch(e){} }
};
// set after "Sign out" so the app doesn't jump straight back in; cleared when the app is closed
const signedOut = {
  get(){ try{ return sessionStorage.getItem('holoul_signed_out') === '1'; }catch(e){ return false; } },
  set(v){ try{ v ? sessionStorage.setItem('holoul_signed_out','1') : sessionStorage.removeItem('holoul_signed_out'); }catch(e){} }
};

async function post(body){
  // text/plain avoids the CORS preflight that Apps Script can't answer
  const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  return res.json();
}

async function api(action, data = {}, retried = false){
  const r = await post({action, token: session && session.token, ...data});
  if(r.auth){
    // session expired: if auto sign in is on, sign in again quietly and repeat the request once
    const saved = remember.get();
    if(saved && !retried){
      const l = await post({action:'login', username: saved.u, pin: saved.p});
      if(l.ok){ session = {token: l.token, user: l.user}; store.set(session); return api(action, data, true); }
      remember.clear();   // PIN changed or user deactivated
    }
    expired(); throw new Error(r.error);
  }
  return r;
}
function expired(){
  store.clear(); session = null; showView('login'); fillRemembered();
  $('msg').textContent = 'Session expired — please sign in again';
}

/* ---------- views ---------- */
function showView(v){
  ['login','home','rec','chk'].forEach(id => $(id).classList.toggle('hidden', id !== v));
  window.scrollTo(0,0);
}

function showHome(){
  const u = session.user;
  showView('home');
  $('uName').textContent = u.name;
  $('uId').textContent = u.id;
  $('uRole').textContent = u.role;
  $('eqBadge').classList.toggle('hidden', !u.equipment);
  $('uEq').textContent = u.equipment || '';

  const t = $('tiles'); t.innerHTML = '';
  if(!u.access || !u.access.length){
    t.innerHTML = '<div class="empty" style="grid-column:1/-1">No pages assigned yet. Ask your supervisor to set your role in the Users sheet.</div>';
    return;
  }
  u.access.forEach(name => {
    const m = MODULES[name] || {sub:'', icon:''};
    const b = document.createElement('button');
    b.className = 'tile' + (u.access.length === 1 ? ' one' : '');
    b.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></div>
                   <div><b>${esc(name)}</b><span>${esc(m.sub)}</span></div>`;
    b.onclick = () => m.checklist ? openChecklist(name) : m.ready ? openRecord(name) : toast(name + ' page — coming next');
    t.appendChild(b);
  });
}

/* ---------- record page ---------- */
let rec = null;   // { sheet, items: [{row, input, dot, saved, timer, busy}], completed }

async function openRecord(sheet){
  showView('rec');
  $('rTitle').textContent = sheet;
  $('rDate').textContent = '';
  $('rList').innerHTML = '<div class="loading">Loading…</div>';
  $('rBanner').classList.add('hidden');
  $('rNote').textContent = '';
  resetComplete();
  rec = { sheet, items: [] };
  try{
    const d = await api('getSheet', {sheet});
    if(!d.ok){ $('rList').innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    $('rDate').textContent = d.date;
    $('rRefHead').textContent = shortRef(d.refHeader);
    $('rColHead').classList.toggle('hidden', d.layout !== 'list');
    d.layout === 'vibration' ? renderVibration(d.rows) : d.layout === 'grouped' ? renderGrouped(d.rows) : renderRows(d.rows);
    setCompleted(d.completed);
    updateCount();
  }catch(e){
    if(session) $('rList').innerHTML = '<div class="empty">No connection — go back and try again.</div>';
  }
}
function shortRef(h){ h = String(h||'').trim(); return h.length > 8 ? 'Ref' : (h || 'Ref'); }

function renderRows(rows){
  const list = $('rList'); list.innerHTML = '';
  rows.forEach(r => {
    if(r.section){
      const s = document.createElement('div'); s.className = 'section'; s.textContent = r.section; list.appendChild(s); return;
    }
    const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `<div><div class="id">${esc(r.id)}</div><div class="ds">${esc(r.desc)}</div></div>
      <div class="ref">${esc(r.ref)}</div>
      <div class="inwrap"><input class="rin" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Reading for ${esc(r.id)}"><i class="dot"></i></div>`;
    list.appendChild(el);
    makeItem(r, el.querySelector('.rin'), el.querySelector('.dot'));
  });
  if(!rec.items.length) list.innerHTML = '<div class="empty">No rows found in this sheet.</div>';
}

/* Vibration: group rows by machine > Motor/Bearing > position, with H / V / A side by side */
function renderVibration(rows){
  const list = $('rList'); list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', '<div class="dirkey">H = Horizontal · V = Vertical · A = Axial &nbsp;|&nbsp; F = Front · B = Back · L = Left · R = Right</div>');
  const DIRS = ['H','V','A'];
  let mEl = null, mName = null, part = null, prowKey = null, cells = null;
  rows.forEach(r => {
    if(r.machine !== mName){
      mName = r.machine; part = null; prowKey = null;
      mEl = document.createElement('div'); mEl.className = 'mach';
      mEl.innerHTML = `<div class="mhead"><b>${esc(r.machine)}</b><span class="mcount"></span></div>`;
      list.appendChild(mEl);
    }
    if(r.part !== part){
      part = r.part; prowKey = null;
      mEl.insertAdjacentHTML('beforeend', `<div class="part">${esc(r.part)}</div>`);
    }
    if(r.part + r.pos !== prowKey){
      prowKey = r.part + r.pos;
      const p = document.createElement('div'); p.className = 'prow';
      p.innerHTML = `<div class="pos"><b>${esc(r.pos)}</b><small>${esc(r.posName)}</small></div><div class="cells"></div>`;
      mEl.appendChild(p);
      cells = p.querySelector('.cells');
      // fixed H / V / A slots so columns line up; unused slots stay empty
      DIRS.forEach(dir => { const s = document.createElement('div'); s.className = 'cell'; s.dataset.dir = dir; cells.appendChild(s); });
    }
    const slot = cells.querySelector(`[data-dir="${r.dir}"]`) || cells.appendChild(Object.assign(document.createElement('div'), {className:'cell'}));
    slot.innerHTML = `<span>${esc(r.dir)}</span><input class="rin" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(r.machine + ' ' + r.part + ' ' + r.posName + ' ' + r.dirName)}"><i class="dot"></i>`;
    const item = makeItem(r, slot.querySelector('.rin'), slot.querySelector('.dot'));
    item.machineEl = mEl;
  });
  if(!rec.items.length) list.innerHTML = '<div class="empty">No rows found in this sheet.</div>';
}

/* Grouped (Thermo Rec): card per area, one line per equipment, its points (Motor, Gearbox…) side by side */
function renderGrouped(rows){
  const list = $('rList'); list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', '<div class="dirkey">Temperature in °C</div>');
  let card = null, group = null, line = null, item = null;
  rows.forEach(r => {
    if(r.group !== group){
      group = r.group; item = null;
      card = document.createElement('div'); card.className = 'mach';
      card.innerHTML = `<div class="mhead"><b>${esc(r.group)}</b><span class="mcount"></span></div>`;
      list.appendChild(card);
    }
    if(r.item !== item){
      item = r.item;
      line = document.createElement('div'); line.className = 'prow gline';
      line.innerHTML = `<div class="pos"><b>${esc(r.item)}</b></div><div class="cells"></div>`;
      card.appendChild(line);
    }
    const cells = line.querySelector('.cells');
    const slot = document.createElement('div'); slot.className = 'cell';
    slot.innerHTML = `<span>${esc(r.point)}</span><input class="rin" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(r.item + ' ' + r.point)}"><i class="dot"></i>`;
    cells.appendChild(slot);
    cells.style.gridTemplateColumns = `repeat(${Math.max(2, cells.children.length)},1fr)`;
    makeItem(r, slot.querySelector('.rin'), slot.querySelector('.dot')).machineEl = card;
  });
  if(!rec.items.length) list.innerHTML = '<div class="empty">No rows found in this sheet.</div>';
}

/* Shared behaviour for every reading box: auto-save, dots, Enter = next */
function makeItem(r, input, dot){
  const item = { row: r.row, input, dot, saved: r.value || '', timer: null, busy: false };
  input.value = item.saved;
  setDot(item, item.saved ? 'ok' : '');
  input.addEventListener('input', () => {
    clearTimeout(item.timer);
    if(input.value.trim() !== item.saved){ setDot(item, 'edit'); item.timer = setTimeout(() => save(item), 1500); }
    else setDot(item, item.saved ? 'ok' : '');
  });
  input.addEventListener('blur', () => { clearTimeout(item.timer); save(item); });
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); const i = rec.items.indexOf(item); const nx = rec.items[i+1]; nx ? nx.input.focus() : input.blur(); }
  });
  dot.addEventListener('click', () => { if(dot.classList.contains('err')) save(item); });
  rec.items.push(item);
  return item;
}

function setDot(item, state){ item.dot.className = 'dot' + (state ? ' ' + state : ''); }

async function save(item){
  const v = item.input.value.trim();
  if(v === item.saved){ if(!item.busy) setDot(item, v ? 'ok' : ''); return; }
  if(item.busy){ item.again = true; return; }       // save again once the current save finishes
  item.busy = true; setDot(item, 'saving');
  try{
    const r = await api('saveReading', {sheet: rec.sheet, row: item.row, value: v});
    if(!r.ok) throw new Error(r.error);
    item.saved = v;
    if(r.column) $('rDate').dataset.col = r.column;
  }catch(e){
    item.busy = false; setDot(item, 'err');
    if(session) toast('Not saved: ' + (e.message || 'no connection') + ' — tap the red dot to retry');
    return;
  }
  item.busy = false;
  if(item.again || item.input.value.trim() !== item.saved){ item.again = false; return save(item); }
  setDot(item, item.saved ? 'ok' : '');
  updateCount();
}

function updateCount(){
  const total = rec.items.length, done = rec.items.filter(i => i.saved !== '').length;
  $('rDone').textContent = done; $('rTotal').textContent = total;
  $('rBar').style.width = total ? (done / total * 100) + '%' : 0;
  // per-machine counter on the vibration page
  const per = new Map();
  rec.items.forEach(i => { if(!i.machineEl) return; const c = per.get(i.machineEl) || [0,0]; c[1]++; if(i.saved !== '') c[0]++; per.set(i.machineEl, c); });
  per.forEach((c, el) => { const s = el.querySelector('.mcount'); s.textContent = `${c[0]} / ${c[1]}`; s.style.color = c[0] === c[1] ? 'var(--ok)' : ''; });
}

function setCompleted(c){
  const b = $('rBanner');
  if(c){ b.textContent = `✓ Completed today by ${c.by} at ${c.at} (${c.filled}/${c.total} readings)`; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}

let confirmMissing = false;
function resetComplete(){ confirmMissing = false; const b = $('rComplete'); b.textContent = 'Complete task'; b.className = 'primary'; b.disabled = false; }

$('rComplete').onclick = async () => {
  const b = $('rComplete');
  // finish any pending edits first
  rec.items.forEach(i => { clearTimeout(i.timer); if(i.input.value.trim() !== i.saved) save(i); });
  if(rec.items.some(i => i.busy || i.dot.classList.contains('edit'))){ $('rNote').textContent = 'Saving your last readings… tap again in a moment.'; return; }
  if(rec.items.some(i => i.dot.classList.contains('err'))){ $('rNote').textContent = 'Some readings are not saved (red dots). Tap them to retry first.'; return; }
  const missing = rec.items.filter(i => i.saved === '').length;
  if(missing && !confirmMissing){
    confirmMissing = true;
    $('rNote').textContent = `${missing} reading${missing > 1 ? 's are' : ' is'} empty. Tap again to complete anyway.`;
    b.textContent = 'Complete anyway';
    const first = rec.items.find(i => i.saved === '');
    first && first.input.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  b.disabled = true; b.textContent = 'Submitting…'; $('rNote').textContent = '';
  try{
    const r = await api('complete', {sheet: rec.sheet});
    if(!r.ok) throw new Error(r.error);
    setCompleted(r.completed);
    b.className = 'primary green'; b.textContent = `✓ Task completed (${r.filled}/${r.total})`;
    toast('Task recorded — thank you');
    setTimeout(() => { resetComplete(); showHome(); }, 1800);
  }catch(e){
    b.disabled = false; b.textContent = 'Complete task';
    if(session) $('rNote').textContent = 'Could not submit: ' + (e.message || 'no connection');
  }
};

$('back').onclick = () => {
  const pending = rec && rec.items.some(i => i.busy || i.input.value.trim() !== i.saved);
  if(pending){ rec.items.forEach(i => { clearTimeout(i.timer); save(i); }); toast('Saving… try Back again in a moment'); return; }
  showHome();
};

/* ---------- daily check (Bobcat / Forklift) ---------- */
let chk = null;   // { type, unit, d (server data), ans: {item: {v, note, value, photo, thumb, up}} }
let photoFor = null;
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const shortDate = s => { if(!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); };
const draftKey = () => `holoul_chk_${chk.type}_${chk.unit}_${chk.d.today}`;
function saveDraft(){
  try{
    const out = {}; Object.entries(chk.ans).forEach(([k, a]) => { out[k] = {v:a.v, note:a.note, value:a.value, photo:a.photo, thumb:a.thumb}; });
    localStorage.setItem(draftKey(), JSON.stringify(out));
  }catch(e){}
}

async function openChecklist(type, unit){
  showView('chk');
  $('cTitle').textContent = type + ' daily check';
  $('cDate').textContent = ''; $('cNote').textContent = '';
  $('cList').innerHTML = '<div class="loading">Loading…</div>';
  $('cBanner').classList.add('hidden');
  $('cSubmit').className = 'primary'; $('cSubmit').disabled = false; $('cSubmit').textContent = 'Submit daily check';
  try{
    const d = await api('getChecklist', {type, unit});
    if(!d.ok){ $('cList').innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    chk = { type, unit: d.unit, d, ans: {} };
    $('cDate').textContent = d.date;
    $('cUnit').innerHTML = d.units.map(u => `<option ${u === d.unit ? 'selected' : ''}>${esc(u)}</option>`).join('');
    $('cUnit').disabled = d.units.length < 2;
    // start from today's saved entry (if any), then any unsent draft on this phone
    d.items.forEach(it => chk.ans[it.item] = {});
    if(d.todayEntry){
      const e = d.todayEntry;
      const notes = {}; String(e.faults || '').split('\n').forEach(l => { const i = l.indexOf(': '); if(i > 0) notes[l.slice(0, i)] = l.slice(i + 2).replace(/ \(photo: [^)]*\)$/, ''); });
      d.items.forEach(it => {
        const v = e.values[it.item] || '', a = chk.ans[it.item];
        if(it.input === 'reading'){ a.value = v; a.photo = e.values[it.item + ' Photo'] || ''; }
        else { a.v = v === '✓' ? 'ok' : v === '✗' ? 'fault' : ''; a.note = notes[it.item] || ''; }
      });
      showSubmitted(e.at, e.by, e.status, true);
    }
    try{ const dr = JSON.parse(localStorage.getItem(draftKey())); if(dr) Object.entries(dr).forEach(([k, a]) => { if(chk.ans[k]) Object.assign(chk.ans[k], a); }); }catch(e){}
    renderChecklist();
  }catch(e){
    if(session) $('cList').innerHTML = '<div class="empty">No connection — go back and try again.</div>';
  }
}

function showSubmitted(at, by, status, existing){
  const b = $('cBanner');
  const bad = /action/i.test(status || '');
  b.textContent = `✓ Submitted today at ${at} by ${by} — ${status || 'OK'}` + (existing ? '. You can change it and submit again.' : '');
  b.style.background = bad ? 'rgba(239,68,68,.1)' : ''; b.style.borderColor = bad ? 'rgba(239,68,68,.4)' : ''; b.style.color = bad ? '#fca5a5' : '';
  b.classList.remove('hidden');
  if(existing) $('cSubmit').textContent = 'Update daily check';
}

function renderChecklist(){
  const list = $('cList'); list.innerHTML = '';
  let sec = null;
  chk.d.items.forEach(it => {
    const a = chk.ans[it.item];
    if(it.section !== sec){
      sec = it.section;
      list.insertAdjacentHTML('beforeend', `<div class="sect">${esc(sec || 'Checks')}${it.weekly ? '<span>once a week</span>' : ''}</div>`);
    }
    const el = document.createElement('div');
    el.className = 'ci' + (a.v === 'fault' ? ' fault' : '');
    if(it.input === 'reading'){
      const last = chk.d.last[it.item];
      const unitTxt = /hour/i.test(it.item) ? 'h' : '';
      el.innerHTML = `<div class="nm">${esc(it.item)}${last ? `<small>Last: ${esc(last.value)}${unitTxt ? ' ' + unitTxt : ''} · ${esc(shortDate(last.date))} · ${esc(last.by)}</small>` : ''}</div>
        <div class="rd"><input inputmode="decimal" autocomplete="off" placeholder="Enter reading" value="${esc(a.value || '')}" aria-label="${esc(it.item)}">${unitTxt ? `<span class="unit">${unitTxt}</span>` : ''}</div>
        <div class="hint" data-warn></div>
        <div class="fx">${photoBlock(it, a)}</div>`;
      const inp = el.querySelector('input');
      inp.addEventListener('input', () => { a.value = inp.value.trim(); checkReading(it, a, el.querySelector('[data-warn]')); saveDraft(); updateChkCount(); });
      checkReading(it, a, el.querySelector('[data-warn]'));
    } else {
      const sub = it.weekly ? `<small>${chk.d.weeklyLast[it.item] ? 'Last done ' + esc(shortDate(chk.d.weeklyLast[it.item])) : 'Not done yet'} · leave blank if not today</small>` : '';
      el.innerHTML = `<div class="top"><div class="nm">${esc(it.item)}${sub}</div>
          <div class="seg"><button class="ok ${a.v === 'ok' ? 'on' : ''}" aria-label="No fault">✓</button><button class="bad ${a.v === 'fault' ? 'on' : ''}" aria-label="Action required">✗</button></div></div>
        ${a.v === 'fault' ? `<div class="fx"><textarea placeholder="What is wrong? (required)">${esc(a.note || '')}</textarea>${photoBlock(it, a)}</div>` : ''}`;
      const [ok, bad] = el.querySelectorAll('.seg button');
      ok.onclick = () => { a.v = a.v === 'ok' && it.weekly ? '' : 'ok'; saveDraft(); renderChecklist(); };
      bad.onclick = () => { a.v = 'fault'; saveDraft(); renderChecklist(); setTimeout(() => { const t = document.querySelector(`[data-item="${CSS.escape(it.item)}"] textarea`); t && t.focus(); }, 0); };
      const ta = el.querySelector('textarea');
      if(ta) ta.addEventListener('input', () => { a.note = ta.value; saveDraft(); });
    }
    el.dataset.item = it.item;
    const pb = el.querySelector('.pbtn');
    if(pb) pb.onclick = () => { photoFor = it.item; $('photoPick').value = ''; $('photoPick').click(); };
    const retry = el.querySelector('[data-retry]');
    if(retry) retry.onclick = () => uploadFor(it.item);
    list.appendChild(el);
  });
  updateChkCount();
}

function photoBlock(it, a){
  if(it.photo === 'no') return '';
  const label = a.thumb || a.photo ? 'Retake / change photo' : (it.photo === 'required' ? 'Take photo of the meter (required)' : 'Add photo (optional)');
  let status = '';
  if(a.up === 'saving') status = '<i class="dot saving"></i> Uploading…';
  else if(a.up === 'err') status = '<i class="dot err" data-retry></i> Not uploaded — tap red dot to retry';
  else if(a.photo) status = '<i class="dot ok"></i> Saved to Drive';
  const img = a.thumb ? `<img src="${a.thumb}" alt="">` : '';
  return `<button type="button" class="pbtn ${it.photo === 'required' && !a.photo ? 'req' : ''}">${CAM}<span>${label}</span></button>
          ${img || status ? `<div class="thumb">${img}<small>${status}</small></div>` : ''}`;
}

function checkReading(it, a, el){
  el.textContent = ''; el.className = 'hint';
  const last = chk.d.last[it.item], n = parseFloat(String(a.value || '').replace(',', '.'));
  if(!last || isNaN(n)) return;
  const prev = parseFloat(String(last.value).replace(',', '.'));
  if(isNaN(prev)) return;
  const days = Math.max(1, Math.round((new Date(chk.d.today) - new Date(last.date)) / 864e5));
  if(n < prev){ el.textContent = `Lower than the last reading (${last.value}). Please check the meter photo.`; el.className = 'hint warn'; }
  else if(/hour/i.test(it.item) && n - prev > 24 * days){ el.textContent = `+${(n - prev).toFixed(1)} h in ${days} day${days > 1 ? 's' : ''} — more than 24 h a day. Please check.`; el.className = 'hint warn'; }
  else el.textContent = `+${(n - prev).toFixed(1)} since last reading`;
}

function updateChkCount(){
  if(!chk) return;
  const need = chk.d.items.filter(it => it.input === 'reading' || !it.weekly);
  const done = need.filter(it => { const a = chk.ans[it.item]; return it.input === 'reading' ? !!a.value : !!a.v; }).length;
  $('cDone').textContent = done; $('cTotal').textContent = need.length;
  $('cBar').style.width = need.length ? (done / need.length * 100) + '%' : 0;
}

/* photos: shrink on the phone (max 1600 px) before uploading, keep a small thumbnail for the screen */
function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = rej; img.src = url; });
}
function scaled(img, max, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
$('photoPick').addEventListener('change', async () => {
  const f = $('photoPick').files[0]; if(!f || !photoFor || !chk) return;
  const a = chk.ans[photoFor];
  try{
    const img = await loadImage(f);
    a.full = scaled(img, 1600, 0.82); a.thumb = scaled(img, 240, 0.7); a.photo = '';
  }catch(e){ toast('Could not read that photo'); return; }
  uploadFor(photoFor);
});
async function uploadFor(item){
  const a = chk.ans[item]; if(!a.full) return;
  a.up = 'saving'; renderChecklist();
  try{
    const r = await api('uploadPhoto', {type: chk.type, unit: chk.unit, kind: item, data: a.full});
    if(!r.ok) throw new Error(r.error);
    a.photo = r.url; a.up = ''; delete a.full;
  }catch(e){ a.up = 'err'; if(session) toast('Photo not uploaded: ' + (e.message || 'no connection')); }
  saveDraft(); renderChecklist();
}

$('cUnit').onchange = () => openChecklist(chk.type, $('cUnit').value);
$('cBack').onclick = () => {
  if(chk && Object.values(chk.ans).some(a => a.up === 'saving')){ toast('A photo is still uploading…'); return; }
  showHome();
};

$('cSubmit').onclick = async () => {
  const b = $('cSubmit'), note = $('cNote');
  const ans = chk.ans, missing = [];
  let firstEl = null;
  chk.d.items.forEach(it => {
    const a = ans[it.item]; let bad = false;
    if(it.input === 'reading'){ if(!a.value){ missing.push(it.item); bad = true; } if(it.photo === 'required' && !a.photo){ missing.push('meter photo'); bad = true; } }
    else if(!it.weekly && !a.v){ missing.push(it.item); bad = true; }
    if(a.v === 'fault' && !String(a.note || '').trim()){ missing.push('describe fault: ' + it.item); bad = true; }
    if(bad && !firstEl) firstEl = document.querySelector(`[data-item="${CSS.escape(it.item)}"]`);
  });
  if(Object.values(ans).some(a => a.up === 'saving')){ note.textContent = 'Wait for the photo to finish uploading.'; return; }
  if(missing.length){
    note.textContent = missing.length === 1 ? 'Still needed: ' + missing[0] : `${missing.length} items still needed (first: ${missing[0]})`;
    firstEl && firstEl.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  note.textContent = ''; b.disabled = true; b.textContent = 'Submitting…';
  const data = {answers: {}};
  Object.entries(ans).forEach(([k, a]) => data.answers[k] = {v: a.v || '', note: a.note || '', value: a.value || '', photo: a.photo || ''});
  try{
    const r = await api('submitCheck', {type: chk.type, unit: chk.unit, data});
    if(!r.ok) throw new Error(r.error);
    try{ localStorage.removeItem(draftKey()); }catch(e){}
    showSubmitted(r.at, r.by, r.status, false);
    b.className = 'primary green'; b.textContent = r.faults ? `✓ Submitted — ${r.faults} fault${r.faults > 1 ? 's' : ''} reported` : '✓ Submitted — all OK';
    toast('Daily check saved — thank you');
    setTimeout(() => showHome(), 2200);
  }catch(e){
    b.disabled = false; b.textContent = 'Submit daily check';
    if(session) note.textContent = 'Could not submit: ' + (e.message || 'no connection');
  }
};

/* ---------- sign in / out ---------- */
let tt;
function toast(s){ const e=$('toast'); e.textContent=s; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),2600); }

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('btn'); $('msg').textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  const u = $('username').value.trim(), p = $('pin').value.trim();
  try{
    const r = await post({action:'login', username: u, pin: p});
    if(r.ok){
      session = {token: r.token, user: r.user}; store.set(session); signedOut.set(false);
      $('auto').checked ? remember.set(u, p) : remember.clear();
      if(!$('auto').checked) $('pin').value = '';
      showHome();
    } else {
      $('msg').textContent = r.error || 'Sign in failed';
      if(remember.get()){ remember.clear(); $('auto').checked = false; }   // saved PIN no longer valid
    }
  }catch(e){
    $('msg').textContent = 'No connection — check internet and try again';
  }finally{
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});

// unticking forgets the saved sign-in straight away
$('auto').addEventListener('change', () => { if(!$('auto').checked){ remember.clear(); $('pin').value = ''; } });

$('logout').onclick = () => {
  store.clear(); session = null; signedOut.set(true);
  fillRemembered();            // keep the saved user filled in, but don't sign in again by itself
  showView('login');
};

function fillRemembered(){
  const saved = remember.get();
  $('auto').checked = !!saved;
  if(saved){ $('username').value = saved.u; $('pin').value = saved.p; }
}

/* ---------- start ---------- */
session = store.get();
if(session) showHome();
else {
  showView('login');
  fillRemembered();
  if(remember.get() && !signedOut.get()) $('form').requestSubmit();   // auto sign in
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
