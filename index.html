<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holoul Maintenance</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0f141b; --panel:#171e28; --panel2:#1f2835; --line:#2a3544;
    --text:#e8edf3; --muted:#8a97a8; --amber:#f5a524; --amber-ink:#1a1204;
    --ok:#34d399; --err:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  .wrap{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .hidden{display:none!important}

  /* Sign in */
  #login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .logo{width:48px;height:48px;border-radius:12px;background:#111827;border:1px solid var(--line);display:grid;place-items:center}
  .brand h1{font-size:22px;letter-spacing:.2px}
  .brand p{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  input{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
        color:var(--text);font-size:16px;padding:0 14px;outline:none;margin-bottom:16px}
  input:focus{border-color:var(--amber)}
  #pin{letter-spacing:6px}
  button.primary{width:100%;height:50px;border:0;border-radius:10px;background:var(--amber);color:var(--amber-ink);
        font-weight:700;font-size:16px;cursor:pointer}
  button.primary:disabled{opacity:.6}
  .msg{min-height:20px;font-size:14px;color:var(--err);margin-top:12px;text-align:center}
  .demo{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .demo code{color:var(--amber)}

  /* Home */
  #home{padding:20px 0 32px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .hello small{color:var(--muted);font-size:13px}
  .hello h2{font-size:20px;margin-top:2px}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;height:38px;padding:0 14px;font-size:14px;cursor:pointer}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge b{color:var(--text);font-weight:600}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:118px;
        display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;color:var(--text)}
  .tile:active{transform:scale(.98)}
  .tile .ic{width:38px;height:38px;border-radius:10px;background:rgba(245,165,36,.12);display:grid;place-items:center}
  .tile .ic svg{width:22px;height:22px;stroke:var(--amber)}
  .tile b{font-size:15px;display:block;margin-top:12px}
  .tile span{font-size:12px;color:var(--muted)}
  .tile.one{grid-column:1/-1}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- SIGN IN -->
  <section id="login">
    <div class="brand">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
      </div>
      <div><h1>Holoul Maintenance</h1><p>Sign in to continue</p></div>
    </div>

    <form class="card" id="form" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" autocapitalize="none" autocomplete="username" spellcheck="false" required>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required>
      <button class="primary" id="btn" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="demo hidden" id="demoNote">
      Demo mode — not connected to Google Sheets yet.<br>
      Try <code>tech1 / 1111</code> · <code>op1 / 3333</code> · <code>op2 / 4444</code>
    </div>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden">
    <div class="top">
      <div class="hello"><small>Welcome</small><h2 id="uName"></h2></div>
      <button class="ghost" id="logout">Sign out</button>
    </div>
    <div class="badges">
      <div class="badge">ID <b id="uId"></b></div>
      <div class="badge">Role <b id="uRole"></b></div>
      <div class="badge hidden" id="eqBadge">Equipment <b id="uEq"></b></div>
    </div>
    <h3>Your access</h3>
    <div class="grid" id="tiles"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ===== CONFIG ===== paste your Apps Script Web app URL here */
const API_URL = 'https://script.google.com/macros/s/AKfycby6cn2Os6fkkireTwP8QJqV-8E45gf5V6wovl_8fz28RL_vEG3Rg0nuuEKFv3kwdYWMCw/exec';

/* Page catalogue — later each "page" gets its own form */
const MODULES = {
  'Amp Rec':       { sub:'Motor current readings',   icon:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>' },
  'Vibration Rec': { sub:'Bearing & motor vibration',icon:'<path d="M2 12h3l2-6 4 12 4-12 2 6h5"/>' },
  'Thermo Rec':    { sub:'Motor & gearbox temps',    icon:'<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>' },
  'Forklift':      { sub:'Daily forklift check',     icon:'<path d="M3 18V8h6l3 6v4M12 18h3M16 4v14h5M3 18h1"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/>' },
  'Bobcat':        { sub:'Daily bobcat check',       icon:'<path d="M3 16V9h7l2 3h5v4M17 12l4-4"/><circle cx="7" cy="17" r="2"/><circle cx="15" cy="17" r="2"/>' }
};

/* Demo users (used only while API_URL is empty) */
const DEMO = [
  {u:'tech1',p:'1111',id:'U001',name:'Technician 1',role:'Maintenance Technician',equipment:''},
  {u:'tech2',p:'2222',id:'U002',name:'Technician 2',role:'Maintenance Technician',equipment:''},
  {u:'op1',p:'3333',id:'U003',name:'Operator 1',role:'Operator',equipment:'Forklift'},
  {u:'op2',p:'4444',id:'U004',name:'Operator 2',role:'Operator',equipment:'Bobcat'}
];
function accessFor(role, eq){
  if(role==='Maintenance Technician') return ['Amp Rec','Vibration Rec','Thermo Rec'];
  if(role==='Operator' && (eq==='Forklift'||eq==='Bobcat')) return [eq];
  return [];
}

const $ = id => document.getElementById(id);
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('holoul_user')); }catch(e){ return null; } },
  set(u){ try{ localStorage.setItem('holoul_user', JSON.stringify(u)); }catch(e){} },
  clear(){ try{ localStorage.removeItem('holoul_user'); }catch(e){} }
};

async function login(username, pin){
  if(!API_URL){
    const d = DEMO.find(x => x.u === username.toLowerCase() && x.p === pin);
    if(!d) return {ok:false, error:'Wrong username or PIN'};
    return {ok:true, user:{id:d.id,name:d.name,role:d.role,equipment:d.equipment,access:accessFor(d.role,d.equipment)}};
  }
  // text/plain avoids the CORS preflight that Apps Script can't answer
  const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'login', username, pin})});
  return res.json();
}

function showHome(u){
  $('login').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('uName').textContent = u.name;
  $('uId').textContent = u.id;
  $('uRole').textContent = u.role;
  $('eqBadge').classList.toggle('hidden', !u.equipment);
  $('uEq').textContent = u.equipment || '';

  const t = $('tiles'); t.innerHTML = '';
  if(!u.access || !u.access.length){
    t.innerHTML = '<div class="empty" style="grid-column:1/-1">No pages assigned yet. Ask your supervisor to set your role in the Users sheet.</div>';
    return;
  }
  u.access.forEach(name => {
    const m = MODULES[name] || {sub:'', icon:''};
    const b = document.createElement('button');
    b.className = 'tile' + (u.access.length === 1 ? ' one' : '');
    b.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></div>
                   <div><b>${name}</b><span>${m.sub}</span></div>`;
    b.onclick = () => toast(name + ' page — coming next');
    t.appendChild(b);
  });
}

function showLogin(){
  $('home').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pin').value = '';
}

let tt;
function toast(s){ const e=$('toast'); e.textContent=s; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),1800); }

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('btn'); $('msg').textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    const r = await login($('username').value.trim(), $('pin').value.trim());
    if(r.ok){ store.set(r.user); showHome(r.user); }
    else $('msg').textContent = r.error || 'Sign in failed';
  }catch(e){
    $('msg').textContent = 'No connection — check internet and try again';
  }finally{
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
$('logout').onclick = () => { store.clear(); showLogin(); };

if(!API_URL) $('demoNote').classList.remove('hidden');
const saved = store.get();
if(saved) showHome(saved);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
